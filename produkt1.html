<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Modell 1 – 3D Druck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font-family:Arial; background:#fafafa; }

  .container {
    display:flex;
    flex-wrap:wrap;
    gap:30px;
    padding:30px;
    animation:fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
  }

  .left {
    flex:1;
    min-width:300px;
  }

  .left img {
    width:100%;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
  }

  .right {
    flex:1;
    min-width:300px;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
  }

  h2 { margin-top:0; font-size:28px; }
  .price { font-size:32px; font-weight:bold; margin:10px 0; color:#0078ff; }
  p { color:#444; line-height:1.5; }

  button {
    margin-top:20px;
    padding:12px 20px;
    font-size:18px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:background .2s;
  }
  button:hover { background:#1e7e34; }
</style>
</head>
<body>

<div class="container">

  <div class="left">
    <img src="img/modell1_1.jpg">
  </div>

  <div class="right">
    <h2>Modell 1</h2>
    <div class="price">12 CHF</div>

    <p>
      Ein hochwertiges 3D‑gedrucktes Modell, perfekt für Deko, Technik oder kreative Projekte.
      Präzise gedruckt mit hoher Detailgenauigkeit.
    </p>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="hidden" name="Produkt" value="Modell 1">
      <button type="submit">Bestellen</button>
    </form>
  </div>

</div>

</body>
</html>
