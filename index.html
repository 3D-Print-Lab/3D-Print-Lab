<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Druck – JOJO888</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
  }

  header {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  .item {
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
  }

  .item img {
    width: 100%;
    border-radius: 10px;
  }

  button {
    margin-top: 10px;
    padding: 10px 15px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: #005fcc;
  }

  #popup {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
  }

  #popupContent {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
  }

  select, input[type="submit"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
  }

  input[type="submit"] {
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  input[type="submit"]:hover {
    background: #1e7e34;
  }
</style>
</head>
<body>

<header>
  <h1>3D Druck – JOJO888</h1>
  <p>Individuelle 3D‑Drucke im Raum Zürich</p>
</header>

<div class="grid">

  <!-- Beispiel Produkt 1 -->
  <div class="item">
    <img src="https://via.placeholder.com/300x200?text=3D+Modell+1" alt="3D Druck 1">
    <h3>3D Modell 1</h3>
    <button onclick="openPopup('3D Modell 1')">Bestellen</button>
  </div>

  <!-- Beispiel Produkt 2 -->
  <div class="item">
    <img src="https://via.placeholder.com/300x200?text=3D+Modell+2" alt="3D Druck 2">
    <h3>3D Modell 2</h3>
    <button onclick="openPopup('3D Modell 2')">Bestellen</button>
  </div>

  <!-- Beispiel Produkt 3 -->
  <div class="item">
    <img src="https://via.placeholder.com/300x200?text=3D+Modell+3" alt="3D Druck 3">
    <h3>3D Modell 3</h3>
    <button onclick="openPopup('3D Modell 3')">Bestellen</button>
  </div>

</div>

<!-- Popup -->
<div id="popup">
  <div id="popupContent">
    <h3 id="productName"></h3>

    <form action="https://formspree.io/f/mwlpqbeb" method="POST">
      <label>Filament:</label>
      <select name="Filament">
        <option>PLA</option>
        <option>PETG</option>
        <option>TPU</option>
      </select>

      <label>Farbe:</label>
      <select name="Farbe">
        <option>Schwarz</option>
        <option>Weiss</option>
        <option>Rot</option>
        <option>Blau</option>
        <option>Grün</option>
      </select>

      <input type="hidden" name="Produkt" id="hiddenProduct">

      <input type="submit" value="Bestellung senden">
    </form>

    <button onclick="closePopup()">Abbrechen</button>
  </div>
</div>

<script>
function openPopup(product) {
  document.getElementById("productName").innerText = product;
  document.getElementById("hiddenProduct").value = product;
  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
